<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>ノブナガ・ファイル｜普請中</title>
<meta name="description" content="只今普請中に候。いま暫く御待ち下され候。">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<style>
  :root {
    --washi: #f3efe6;
    --sumi:  #23201c;
    --sumi-soft: #57514a;
    --ki:      #b99a67;
    --ki-deep: #a2814f;
    --ki-edge: #7d6136;
    --yane:    #3a332b;
    --font-mincho: "Noto Serif JP", "Yu Mincho", "Hiragino Mincho ProN", serif;
    --font-gothic: "Noto Sans JP", "Hiragino Sans", "Yu Gothic", sans-serif;

    --yuka-h: 26%;    /* 板の間の高さ */
    --fusuma-h: 52%;  /* 襖の高さ（床の上に載る） */
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--washi); color: var(--sumi);
    font-family: var(--font-gothic); -webkit-font-smoothing: antialiased;
  }

  .scene { position: relative; min-height: 100%; min-height: 100svh; overflow: hidden; }

  /* 上方（生成りの紙） */
  .scene::before {
    content: ''; position: absolute; inset: 0; z-index: 0;
    background: var(--washi) url('/images/washi-bg.webp') center / cover no-repeat;
    opacity: .85;
  }

  /* 襖：床の上に立つ */
  .fusuma {
    position: absolute; left: 0; right: 0;
    bottom: var(--yuka-h);
    width: 100%; height: var(--fusuma-h);
    min-height: 190px;
    z-index: 1; display: block;
  }
  /* 板の間 */
  .yuka {
    position: absolute; left: 0; right: 0; bottom: 0;
    width: 100%; height: var(--yuka-h);
    min-height: 120px;
    z-index: 2; display: block;
  }

  /* 高札：床の上に立てる。下端＝床の手前ではなく、敷居のすぐ手前 */
  .kosatsu {
    position: absolute; left: 50%;
    bottom: calc(var(--yuka-h) - 4.2rem);
    transform: translateX(-50%);
    z-index: 4;
    display: flex; flex-direction: column; align-items: center;
  }

  .mei {
    position: absolute; left: 0; right: 0; top: 8%;
    z-index: 4; text-align: center; margin: 0;
  }
  .mei-ja {
    margin: 0; font-family: var(--font-mincho);
    font-size: 1.05rem; font-weight: 700; letter-spacing: .12em; color: var(--sumi-soft);
  }
  .mei-en { margin: .25rem 0 0; font-size: .56rem; letter-spacing: .3em; color: var(--sumi-soft); }

  .yane {
    width: 17.5rem; height: 1.15rem; background: var(--yane);
    border-radius: 3px 3px 0 0;
    box-shadow: 0 2px 0 rgba(35,32,28,.35);
    clip-path: polygon(3% 0, 97% 0, 100% 100%, 0 100%);
  }
  .fuda {
    width: 15.4rem;
    background: linear-gradient(180deg, var(--ki) 0%, var(--ki) 70%, var(--ki-deep) 100%);
    border: 2px solid var(--ki-edge); border-top: none;
    padding: 1.5rem 1.15rem 1.6rem;
    box-shadow: 0 12px 26px rgba(27,22,16,.42);
    display: flex; justify-content: center;
  }
  .tategaki {
    -webkit-writing-mode: vertical-rl;
    writing-mode: vertical-rl;
    font-family: var(--font-mincho); color: #241f18;
    height: 11.2rem;
  }
  .midashi {
    margin: 0 0 0 1.05rem;
    font-size: 2.3rem; font-weight: 700; letter-spacing: .16em;
    line-height: 1.05; white-space: nowrap;
  }
  .honbun {
    margin: 0; font-size: .8rem; letter-spacing: .1em; line-height: 1.9;
    color: #3b3227; white-space: nowrap;
  }

  /* 柱：床まで伸ばす */
  .hashira {
    width: 1rem; height: 4.2rem;
    background: linear-gradient(90deg, var(--ki-deep) 0%, var(--ki-edge) 55%, #5f4926 100%);
  }
  /* 柱の足元の影 */
  .kage {
    width: 7rem; height: 1.1rem; margin-top: -.35rem;
    background: radial-gradient(ellipse at center, rgba(20,15,9,.55) 0%, rgba(20,15,9,0) 70%);
  }

  .gloss {
    position: absolute; left: 0; right: 0;
    bottom: calc(var(--yuka-h) / 2 - 1rem);
    z-index: 4; text-align: center; margin: 0;
    font-size: .66rem; letter-spacing: .08em;
    color: #efe6d2; opacity: .85;
    text-shadow: 0 1px 3px rgba(20,15,9,.75);
  }

  @media (max-width: 600px) {
    :root { --yuka-h: 22%; --fusuma-h: 40%; }
    .kosatsu { bottom: calc(var(--yuka-h) - 3.2rem); }
    .yane { width: 14.4rem; height: 1rem; }
    .fuda { width: 12.6rem; padding: 1.25rem .85rem 1.35rem; }
    .midashi { font-size: 1.8rem; margin-left: .8rem; }
    .tategaki { height: 9.2rem; }
    .honbun { font-size: .72rem; line-height: 1.85; }
    .hashira { height: 3.2rem; }
    .mei { top: 6%; }
  }
  @media (max-height: 620px) {
    :root { --yuka-h: 22%; --fusuma-h: 38%; }
    .kosatsu { bottom: calc(var(--yuka-h) - 2.8rem); }
    .hashira { height: 2.8rem; }
  }
</style>
</head>
